<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 40" fill="none">
  <!-- Icon Mark: Abstract wall panel / diamond motif -->
  <g>
    <!-- Left panel -->
    <rect x="2" y="8" width="10" height="24" rx="1.5" fill="currentColor" opacity="0.35"/>
    <!-- Center panel (taller) -->
    <rect x="14" y="4" width="10" height="32" rx="1.5" fill="currentColor" opacity="0.6"/>
    <!-- Right panel -->
    <rect x="26" y="8" width="10" height="24" rx="1.5" fill="currentColor" opacity="0.9"/>
    <!-- Diamond accent -->
    <path d="M19 0 L23 4 L19 8 L15 4 Z" fill="currentColor" opacity="0.7"/>
  </g>
  <!-- Logotype text -->
  <text x="44" y="28" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="600" fill="currentColor" letter-spacing="-0.5">
    <tspan>Create</tspan><tspan font-weight="700" font-style="italic">You</tspan>
  </text>
  <text x="170" y="28" font-family="'Inter', 'Segoe UI', sans-serif" font-size="13" font-weight="300" fill="currentColor" letter-spacing="3.5" text-transform="uppercase" opacity="0.75">
    WALLPAPERS
  </text>
</svg>
